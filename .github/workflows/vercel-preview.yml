name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: true
          working-directory: ./

      - name: Comment with deployment details
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deploymentUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';
            const comment = `## 🌀 CAOS Preview Deployment

            Your chaos is ready to explore!

            ### 🔗 Deployment URL
            ${deploymentUrl}

            ### 🎨 Pages
            - [Landing Page](${deploymentUrl})
            - [API Documentation](${deploymentUrl}/docs)
            - [Interactive Playground](${deploymentUrl}/playground)

            ### 🌊 Try the APIs
            \`\`\`bash
            # Lorenz Attractor
            curl ${deploymentUrl}/api/chaos/lorenz?steps=100

            # Logistic Map
            curl ${deploymentUrl}/api/chaos/logistic-map?r=3.7

            # Double Pendulum
            curl ${deploymentUrl}/api/chaos/double-pendulum?duration=5
            \`\`\`

            ---
            *✨ Commit: ${{ github.sha }}*
            *🤖 Deployed by GitHub Actions*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
